version: '3.8'

services:
  git-api:
    build: .
    ports:
      - "3000:3000"
    environment:
      - FLASK_ENV=production
      - PORT=3000
      - REDIS_URL=redis://redis:6379
      - REPOS_DIR=/tmp/n8n-git-repos
      - ALLOWED_ORIGINS=
    volumes:
      - ./repos:/tmp/n8n-git-repos
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes

volumes:
  redis-data:

